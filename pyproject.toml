[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rclk-deep-learning"
version = "0.1.0"
description = "Patient-level R/C/L/K sequence modeling research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.10"]

[tool.setuptools.packages.find]
where = ["src"]

